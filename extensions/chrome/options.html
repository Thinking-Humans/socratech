<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Socratech Clip options</title>
<style>
	:root { color-scheme: light dark; --fg: #1c1c1c; --muted: #6b6b6b; --bg: #fff; --accent: #2f5d50; --err: #b3261e; --line: #d8d8d8; }
	@media (prefers-color-scheme: dark) { :root { --fg: #ececec; --muted: #9a9a9a; --bg: #1e1e1e; --accent: #7fbfae; --err: #f2b8b5; --line: #3a3a3a; } }
	body { max-width: 560px; margin: 32px auto; padding: 0 16px; font: 14px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
	label { display: block; margin-top: 14px; font-weight: 600; }
	input, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: 13px ui-monospace, monospace; }
	p.hint { color: var(--muted); margin: 4px 0 0; font-size: 12px; }
	button { margin-top: 16px; padding: 7px 14px; border: 0; border-radius: 6px; background: var(--accent); color: var(--bg); font-weight: 600; cursor: pointer; }
	#status { margin-top: 10px; }
	#status.err { color: var(--err); }
</style>
</head>
<body>
	<h1>Socratech Clip</h1>
	<p>Easiest: in Socratech, open <b>Settings → Claude</b> and press <b>Connect Claude</b> — this extension sets itself up. Or press <b>Copy extension setup</b> there and paste it here.</p>
	<label for="paste">Paste setup</label>
	<textarea id="paste" rows="3" placeholder='{"server":"http://localhost:3000","token":"…"}'></textarea>
	<label for="server">Server</label>
	<input id="server" placeholder="http://localhost:3000">
	<p class="hint">Browser mode: http://localhost:3000. Desktop app: http://127.0.0.1:47823.</p>
	<label for="token">Token</label>
	<input id="token" type="password" autocomplete="off">
	<button id="save">Save</button>
	<div id="status"></div>
	<script type="module" src="options.js"></script>
</body>
</html>
