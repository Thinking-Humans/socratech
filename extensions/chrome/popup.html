<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	:root { color-scheme: light dark; --fg: #1c1c1c; --muted: #6b6b6b; --bg: #fff; --accent: #2f5d50; --err: #b3261e; }
	@media (prefers-color-scheme: dark) { :root { --fg: #ececec; --muted: #9a9a9a; --bg: #1e1e1e; --accent: #7fbfae; --err: #f2b8b5; } }
	body { margin: 0; width: 300px; padding: 14px; font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
	h1 { font-size: 13px; margin: 0 0 6px; }
	#title { color: var(--muted); margin: 0 0 12px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
	button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: var(--accent); color: var(--bg); font-weight: 600; cursor: pointer; }
	button:disabled { opacity: .6; cursor: default; }
	#status { margin-top: 10px; min-height: 1em; white-space: pre-wrap; }
	#status.err { color: var(--err); }
	a { color: var(--accent); }
	footer { margin-top: 10px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
	<h1>Add to Socratech</h1>
	<p id="title"></p>
	<button id="clip">Add as notebook</button>
	<div id="status"></div>
	<footer><a href="#" id="options">Options</a></footer>
	<script type="module" src="popup.js"></script>
</body>
</html>
